[pytest]
# Pytest configuration for Sistema de Reserva de Churrasqueiras

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Console output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    --maxfail=1
    -ra

# Markers for organizing tests
markers =
    unit: Unit tests - test individual functions/methods in isolation
    integration: Integration tests - test interaction between components
    e2e: End-to-end tests - test complete user workflows
    slow: Tests that take more than 1 second
    database: Tests that require database access
    api: Tests that call external APIs
    smoke: Quick smoke tests for CI/CD

# Minimum Python version
minversion = 3.11

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */venv/*
    */.venv/*
    */migrations/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
precision = 2

[coverage:html]
directory = htmlcov
