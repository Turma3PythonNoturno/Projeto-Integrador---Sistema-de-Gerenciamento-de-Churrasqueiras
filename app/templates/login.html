{% extends "base.html" %}

{% block titulo %}
    {% endblock %}

{% block navbar %}
    {% endblock %}

{% block conteudo %}
<h2 style="text-align: center; margin-bottom: 30px; margin-top: auto; font-size: 40px;">Login</h2>

<div id="mensagem" style="display: none;" class="alert"></div>

<form id="form-reserva" style="max-width: 600px; margin: 0 auto;">
    <!-- Validação de CPF do Associado -->
    <div class="form-group">
        <label for="cpf_associado">CPF do Associado *</label>
        <input type="text" id="cpf_associado" name="cpf_associado" required maxlength="14" 
               placeholder="000.000.000-00">
        <small style="color: #666;">Digite o CPF do associado.</small>
        <div id="status-associado" style="margin-top: 10px;"></div>
    </div>
        <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required maxlength="14" 
               placeholder="(Máximo de 16 caracteres)">
        <small style="color: #666;">Digite sua senha. </small>
        <div id="status-associado" style="margin-top: 10px;"></div>
    </div>
    {% endblock %}
</body>
</html>
