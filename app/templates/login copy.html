{% extends "base.html" %}

{% block titulo %}
    Login
{% endblock %}

{% block navbar %}
{% endblock %}

{% block conteudo %}

<h2 style="text-align: center; margin-bottom: 30px; margin-top: auto; font-size: 40px;">Login</h2>

<div id="mensagem" style="display: none;" class="alert"></div>

    <form id="form-reserva" style="max-width: 600px; margin: 0 auto;">
        <!-- Validação de CPF do Associado -->
        <div class="form-group">
            <label for="cpf_associado">CPF do Associado *</label>
            <input type="tel" id="cpf_associado" name="cpf_associado" pattern="^[0-9]{3}.?[0-9]{3}.?[0-9]{3}-?[0-9]{2}"
                required minlength="11" maxlength="14" autocomplete="username" placeholder="000.000.000-00" oninput="mascaraCPF(this)">
            <small style="color: #666;">Digite o CPF do associado.</small>
            <div id="status-associado" style="margin-top: 10px;"></div>
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" autocomplete="current-password"  required maxlength="14"
                placeholder="(Máximo de 16 caracteres)">
            <small style="color: #666;">Digite sua senha. </small>
            <div id="status-associado" style="margin-top: 10px;"></div>
            <div id="status-associado" style="margin-top: 10px;"></div>
        </div>
        <div style="text-align: center; margin-top: 30px;">
            <button type="submit" class="btn">
                Entrar
            </button>
            <a href="{{ url_for('dashboard.inicio') }}" class="btn btn-secondary" style="text-decoration: none; margin-left: 10px;">
                Cancelar
            </a>
        </div>

        <div id="links-inferiores">
            <a href=""></a>

        </div>
        {% endblock %}

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
